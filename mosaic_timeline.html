<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mosaic — Timeline</title>
<style>
:root{--bg:#f8f7f3;--ink:#292a26;--muted:#89877e;--line:#e5e2d9}*{box-sizing:border-box}body{margin:0;background:#eae8e1;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",sans-serif}.page{max-width:1100px;margin:auto;padding:32px 20px}.intro{display:flex;justify-content:space-between;align-items:end;max-width:780px;margin:0 auto 24px}.kicker{font-size:10px;letter-spacing:.18em;color:var(--muted);margin-bottom:10px}h1{font-size:44px;font-weight:450;letter-spacing:-.05em;margin:0}.intro p{font-size:12px;line-height:1.6;color:#77766e;max-width:290px}.phone{max-width:420px;margin:auto;background:var(--bg);border:1px solid #dedbd2;border-radius:30px;overflow:hidden;box-shadow:0 22px 60px #302c2014}.status{height:34px;padding:11px 23px 0;display:flex;justify-content:space-between;font-size:11px;font-weight:650}.app{padding:12px 19px 0}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.brand{font-size:10px;letter-spacing:.2em;color:#77766e;font-weight:650}.add{width:34px;height:34px;border:1px solid var(--line);border-radius:50%;background:transparent;font-size:22px}.title{display:flex;justify-content:space-between;align-items:end;margin-bottom:18px}.title h2{font-size:34px;font-weight:450;letter-spacing:-.06em;margin:0}.subtitle{font-size:11px;color:#8b8980;margin-top:7px}.year{border:0;background:none;color:#77766e;font-size:12px}.filters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:18px}.filters::-webkit-scrollbar{display:none}.chip{white-space:nowrap;border:1px solid var(--line);border-radius:99px;background:transparent;color:#77766e;padding:8px 12px;font-size:11px}.chip.active{background:var(--ink);color:white;border-color:var(--ink)}.range{border-top:1px solid var(--line);padding:13px 0 20px;display:flex;justify-content:space-between;align-items:center}.range-label{font-size:9px;letter-spacing:.13em;color:#8a887f}.seg{display:flex;gap:3px;background:#eeece5;border-radius:99px;padding:3px}.seg button{border:0;background:none;border-radius:99px;padding:6px 9px;font-size:10px;color:#85837a}.seg button.active{background:#fffefa;color:var(--ink)}.timeline{position:relative;padding-bottom:12px}.timeline:before{content:"";position:absolute;left:39px;top:4px;bottom:15px;width:1px;background:#dfdcd3}.month{margin:0 0 17px 57px;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#85837a}.entry{display:grid;grid-template-columns:40px minmax(0,1fr);gap:17px;position:relative;margin-bottom:25px}.date{text-align:center;background:var(--bg);position:relative;z-index:1;padding-top:4px}.day{font-size:17px;display:block;line-height:1.1}.weekday{font-size:9px;color:#99978e;display:block;margin-top:5px}.dot{position:absolute;left:36px;top:9px;width:7px;height:7px;border-radius:50%;background:#b4b0a4;box-shadow:0 0 0 4px var(--bg);z-index:2}.meta{display:flex;justify-content:space-between;margin-bottom:9px;font-size:9px;letter-spacing:.1em;color:#85837a}.main{display:grid;grid-template-columns:minmax(0,1fr) 112px;gap:12px;align-items:center}.copy{min-width:0;cursor:pointer}.copy h3{font-size:17px;font-weight:500;letter-spacing:-.035em;line-height:1.25;margin:0 0 5px}.creator{font-size:11px;color:#8a887f;margin:0 0 9px}.note{font-size:11px;line-height:1.55;color:#626159;margin:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.cover{height:125px;border-radius:5px;position:relative;overflow:hidden;background:linear-gradient(145deg,var(--a),var(--b));cursor:pointer;isolation:isolate}.cover:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 72% 22%,#fff8 0 3%,transparent 4%),linear-gradient(155deg,transparent 36%,#2222 37%,transparent 61%)}.cover:after{content:"";position:absolute;left:-5%;right:-5%;bottom:-2%;height:52%;background:var(--land);clip-path:polygon(0 68%,24% 25%,42% 57%,66% 0,100% 49%,100% 100%,0 100%)}.cover-title{position:absolute;z-index:2;left:9px;right:7px;bottom:10px;color:var(--cover-ink,#fff);font-size:13px;line-height:1.05;font-weight:650;white-space:normal}.cover.book:after{left:23%;right:23%;bottom:9%;height:77%;background:linear-gradient(90deg,#0002,transparent 18%),#e7dcc8;clip-path:polygon(0 0,100% 0,100% 100%,0 94%)}.cover.book .cover-title{color:#3b3a32;left:29%;right:25%;bottom:22px;font-size:11px}.cover.music:before{background:radial-gradient(circle at 50% 46%,#252822 0 18%,#ded4c1 19% 22%,#343830 23% 32%,transparent 33%),linear-gradient(145deg,var(--a),var(--b))}.cover.music:after,.cover.podcast:after{display:none}.cover.comic:after{background:#f0d7b7;clip-path:polygon(10% 10%,45% 0,53% 30%,95% 22%,90% 85%,48% 100%,25% 68%,0 80%)}.cover.podcast:before{background:repeating-radial-gradient(circle at 50% 48%,transparent 0 8px,#ffffff40 9px 10px),linear-gradient(145deg,var(--a),var(--b))}.divider{height:1px;background:#e9e6de;margin:0 0 22px 57px}.empty{margin:10px 0 28px 57px;color:#8a887f;font-size:12px;line-height:1.6}.nav{border-top:1px solid var(--line);display:grid;grid-template-columns:1fr 1fr;padding:10px 20px 17px}.nav button{border:0;background:none;color:#9b998f;display:flex;justify-content:center;align-items:center;gap:8px;padding:8px;font-size:11px}.nav .selected{color:var(--ink);font-weight:600}.gridicon{width:15px;height:15px;border:1px solid currentColor;background:linear-gradient(90deg,transparent 46%,currentColor 47% 52%,transparent 53%),linear-gradient(0deg,transparent 46%,currentColor 47% 52%,transparent 53%)}.lineicon{width:15px;height:15px;border-left:1px solid currentColor;position:relative}.lineicon:after{content:"";position:absolute;left:-4px;top:2px;width:7px;height:7px;border:1px solid currentColor;border-radius:50%;background:var(--bg);box-shadow:0 7px 0 -1px var(--bg),0 7px 0 0 currentColor}.foot{text-align:center;font-size:11px;color:#77766e;line-height:1.6;margin:18px auto;max-width:350px}.overlay{position:fixed;inset:0;background:#1e1f1b66;display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.overlay.open{display:flex}.modal{width:min(100%,360px);max-height:90vh;overflow:auto;background:var(--bg);border-radius:17px;padding:21px}.modalhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h3{font-size:23px;font-weight:450;margin:0}.close{border:0;background:none;font-size:24px;color:#77766e}.detailcover{height:200px;margin-bottom:17px}.detailcover .cover-title{font-size:23px;left:17px;bottom:17px}.detailtype{font-size:10px;letter-spacing:.14em;color:#85837a;margin-bottom:8px}.detailname{font-size:25px;font-weight:500;margin:0 0 6px}.detailcreator{font-size:12px;color:#85837a;margin:0 0 15px}.detailnote{font-size:13px;line-height:1.7;color:#55554e}.form label{display:block;font-size:11px;color:#77766e;margin:12px 0 6px}.form input,.form textarea,.form select{width:100%;border:1px solid var(--line);border-radius:8px;padding:11px;background:#fffefa;color:var(--ink);font-size:13px}.form textarea{min-height:70px;resize:vertical}.save{width:100%;border:0;border-radius:99px;background:var(--ink);color:white;padding:13px;margin-top:17px;font-size:12px}@media(max-width:480px){body{background:var(--bg)}.page{padding:0}.intro{display:none}.phone{max-width:none;min-height:100vh;border:0;border-radius:0;box-shadow:none}.app{padding-left:17px;padding-right:17px}.cover{height:115px}.main{grid-template-columns:minmax(0,1fr) 105px}.entry{gap:15px}.timeline:before{left:38px}.dot{left:35px}.divider{margin-left:56px}}
</style></head><body><div class="page"><header class="intro"><div><div class="kicker">MOSAIC / PERSONAL ARCHIVE</div><h1>Timeline</h1></div><p>沿着时间回看你收藏过的故事。图片是记忆的入口，作品信息只作轻轻的注脚。</p></header>
<main class="phone"><div class="status"><span>9:41</span><span>●●● ▰</span></div><div class="app"><div class="top"><div class="brand">M O S A I C</div><button class="add" id="openAdd" aria-label="添加记录">＋</button></div><div class="title"><div><h2>Timeline</h2><div class="subtitle">A little archive of what moved you.</div></div><select class="year" id="year"><option>2026</option><option>2025</option><option>2024</option></select></div>
<div class="filters" id="filters"><button class="chip active" data-cat="全部">全部</button><button class="chip" data-cat="电影">电影</button><button class="chip" data-cat="书籍">书籍</button><button class="chip" data-cat="漫画">漫画</button><button class="chip" data-cat="音乐">音乐</button><button class="chip" data-cat="播客">播客</button><button class="chip" data-cat="游戏">游戏</button><button class="chip" data-cat="其他">其他</button></div>
<div class="range"><span class="range-label">YOUR COLLECTION</span><div class="seg"><button class="active" data-range="all">全部</button><button data-range="3">近 3 月</button><button data-range="1">近 1 月</button></div></div><div class="timeline" id="timeline"></div></div>
<nav class="nav"><button id="gallery"><span class="gridicon"></span>Gallery</button><button class="selected"><span class="lineicon"></span>Timeline</button></nav></main><p class="foot">交互式 HTML 原型 · 可筛选分类、切换年份和时间范围，点击作品查看详情，也可以添加本地预览记录。</p></div>
<div class="overlay" id="detailOverlay" role="dialog" aria-modal="true"><div class="modal"><div class="modalhead"><span class="detailtype" id="detailType"></span><button class="close" data-close="detailOverlay">×</button></div><div class="cover detailcover" id="detailCover"><span class="cover-title" id="detailCoverTitle"></span></div><h3 class="detailname" id="detailName"></h3><p class="detailcreator" id="detailCreator"></p><p class="detailnote" id="detailNote"></p><p class="detailcreator" id="detailDate" style="margin-top:18px"></p></div></div>
<div class="overlay" id="addOverlay" role="dialog" aria-modal="true"><form class="modal form" id="form"><div class="modalhead"><h3>New memory</h3><button type="button" class="close" data-close="addOverlay">×</button></div><label for="titleInput">作品名称 *</label><input id="titleInput" required maxlength="90" placeholder="你看过、读过或听过什么？"><label for="catInput">分类</label><select id="catInput"><option>电影</option><option>书籍</option><option>漫画</option><option>音乐</option><option>播客</option><option>游戏</option><option>其他</option></select><label for="creatorInput">作者 / 导演 / 艺术家</label><input id="creatorInput" maxlength="90" placeholder="可选"><label for="dateInput">记录日期</label><input id="dateInput" type="date" required><label for="noteInput">个人感受</label><textarea id="noteInput" maxlength="400" placeholder="留下一个此刻的想法……"></textarea><button class="save" type="submit">保存记录</button></form></div>
<script>
const data=[
{title:"Perfect Days",creator:"Wim Wenders",cat:"电影",date:"2026-10-16",note:"日常里那些微小、安静而确切的幸福。想再找一个没有安排的下午看一次。",art:"movie",a:"#c7b59a",b:"#64766d",land:"#384b43",label:"PERFECT\\nDAYS"},
{title:"The Creative Act",creator:"Rick Rubin",cat:"书籍",date:"2026-10-12",note:"创造不是一个结果，而是一种持续练习感受世界的方式。",art:"book",a:"#b9b0a0",b:"#e7dfd1",land:"#b5a68c",label:"THE\\nCREATIVE ACT"},
{title:"For Emma, Forever Ago",creator:"Bon Iver",cat:"音乐",date:"2026-10-08",note:"适合在走路回家的时候听。声音里有一种很具体的冷空气。",art:"music",a:"#c7b6a0",b:"#727b70",land:"#5e6457",label:"FOR EMMA"},
{title:"蓝色时期",creator:"山口飞翔",cat:"漫画",date:"2026-09-28",note:"关于努力、天赋，以及终于找到自己愿意投入的事情。",art:"comic",a:"#91a4aa",b:"#d9c6ad",land:"#607a83",label:"BLUE\\nPERIOD"},
{title:"Past Lives",creator:"Celine Song",cat:"电影",date:"2026-09-19",note:"有些人生不会发生，但它们仍然是人生的一部分。",art:"movie",a:"#d7c1a3",b:"#a6b2ae",land:"#697a75",label:"PAST LIVES"},
{title:"The Anthropocene Reviewed",creator:"John Green",cat:"书籍",date:"2026-08-23",note:"用一种温柔的方式重新观察日常里那些很容易忽略的事物。",art:"book",a:"#d4c8b5",b:"#b8b4a3",land:"#c4b69d",label:"THE\\nANTHROPOCENE"},
{title:"A Short Hike",creator:"Adam Robinson-Yu",cat:"游戏",date:"2026-07-11",note:"没有压力地散步、探索，偶尔停下来看看风景。",art:"game",a:"#b5c7b5",b:"#7d9b9b",land:"#55776a",label:"A SHORT\\nHIKE"},
{title:"The Moth",creator:"The Moth",cat:"播客",date:"2025-12-02",note:"睡前听一段陌生人的真实故事，像是短暂地借住进别人的人生。",art:"podcast",a:"#c3a99a",b:"#8d817a",land:"#5b5750",label:"THE MOTH"}
];
const months=["January","February","March","April","May","June","July","August","September","October","November","December"];let cat="全部",range="all",year=2026;
const $=id=>document.getElementById(id),esc=s=>String(s||"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const dateOf=s=>{let [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function style(r){return `--a:${r.a};--b:${r.b};--land:${r.land}`}
function render(){let arr=data.filter(r=>(cat==="全部"||r.cat===cat)&&dateOf(r.date).getFullYear()===year);if(range!=="all"){let cutoff=new Date(2026,9,18);cutoff.setMonth(cutoff.getMonth()-Number(range));arr=arr.filter(r=>dateOf(r.date)>=cutoff&&dateOf(r.date)<=new Date(2026,9,18))}arr.sort((a,b)=>b.date.localeCompare(a.date));$("timeline").innerHTML="";if(!arr.length){$("timeline").innerHTML='<div class="empty">这段时间还没有记录。<br>也许可以从最近读完的一本书开始。</div>';return}let last="";arr.forEach(r=>{let d=dateOf(r.date),key=r.date.slice(0,7);if(key!==last){let h=document.createElement("h3");h.className="month";h.textContent=months[d.getMonth()]+" "+d.getFullYear();$("timeline").append(h);last=key}let e=document.createElement("article");e.className="entry";e.innerHTML=`<div class="date"><span class="day">${String(d.getDate()).padStart(2,"0")}</span><span class="weekday">${["SUN","MON","TUE","WED","THU","FRI","SAT"][d.getDay()]}</span></div><span class="dot"></span><div><div class="meta"><span>${esc(r.cat.toUpperCase())}</span><span>${r.cat==="音乐"?"LISTENED":r.cat==="书籍"?"READ":r.cat==="电影"?"WATCHED":"SAVED"}</span></div><div class="main"><div class="copy"><h3>${esc(r.title)}</h3><p class="creator">${esc(r.creator)}</p><p class="note">${esc(r.note)}</p></div><div class="cover ${r.art}" style="${style(r)}" tabindex="0" role="button" aria-label="查看作品"><span class="cover-title">${esc(r.label||r.title).replace(/\\n/g,"<br>")}</span></div></div></div>`;e.querySelector(".cover").onclick=()=>detail(r);e.querySelector(".cover").onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" ")detail(r)};e.querySelector(".copy").onclick=()=>detail(r);$("timeline").append(e)})}
function open(id){$(id).classList.add("open")}function close(id){$(id).classList.remove("open")}
function detail(r){let d=dateOf(r.date);$("detailType").textContent=r.cat.toUpperCase();$("detailCover").className="cover detailcover "+r.art;$("detailCover").setAttribute("style",style(r));$("detailCoverTitle").innerHTML=esc(r.label||r.title).replace(/\\n/g,"<br>");$("detailName").textContent=r.title;$("detailCreator").textContent=r.creator||"未填写创作者";$("detailNote").textContent=r.note||"还没有写下感受。";$("detailDate").textContent=`${d.getFullYear()} · ${months[d.getMonth()]} ${d.getDate()}`;open("detailOverlay")}
document.querySelectorAll("[data-cat]").forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll("[data-cat]").forEach(x=>x.classList.toggle("active",x===b));render()});
document.querySelectorAll("[data-range]").forEach(b=>b.onclick=()=>{range=b.dataset.range;document.querySelectorAll("[data-range]").forEach(x=>x.classList.toggle("active",x===b));render()});
$("year").onchange=e=>{year=Number(e.target.value);render()};
$("openAdd").onclick=()=>{let now=new Date();$("dateInput").value=now.getFullYear()+"-"+String(now.getMonth()+1).padStart(2,"0")+"-"+String(now.getDate()).padStart(2,"0");open("addOverlay")};
document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>close(b.dataset.close));document.querySelectorAll(".overlay").forEach(o=>o.onclick=e=>{if(e.target===o)close(o.id)});document.onkeydown=e=>{if(e.key==="Escape")document.querySelectorAll(".overlay.open").forEach(o=>close(o.id))};
$("form").onsubmit=e=>{e.preventDefault();let title=$("titleInput").value.trim(),date=$("dateInput").value,category=$("catInput").value;if(!title||!date)return;let art={书籍:"book",音乐:"music",漫画:"comic",播客:"podcast",游戏:"game",电影:"movie",其他:"movie"}[category];data.push({title,creator:$("creatorInput").value.trim(),cat:category,date,note:$("noteInput").value.trim(),art,a:"#c8bda9",b:"#8e9b8d",land:"#68756a",label:title.toUpperCase()});year=Number(date.slice(0,4));$("year").value=String(year);cat="全部";document.querySelectorAll("[data-cat]").forEach(b=>b.classList.toggle("active",b.dataset.cat==="全部"));range="all";document.querySelectorAll("[data-range]").forEach(b=>b.classList.toggle("active",b.dataset.range==="all"));e.target.reset();close("addOverlay");render()};
$("gallery").onclick=()=>alert("这是导航示意：实际 App 中会切换到 Gallery 日历页。");render();
</script></body></html>
